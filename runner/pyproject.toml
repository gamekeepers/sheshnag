[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-runner"
version = "0.1.0"
description = "Sheshnag forge-runner — runs finetune jobs on LLaMA-Factory and uploads the adapter"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
forge-runner = "forge_runner.main:main"

[tool.setuptools.packages.find]
include = ["forge_runner*"]
