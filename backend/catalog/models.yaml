# Model catalogue manifest — the curated, pinned models users may select
# for a batch (source of truth; version-controlled = curation audit trail).
#
# Loaded and upserted into `model_catalog` at startup by catalog_seed.py:
#   - new `id`s are inserted
#   - existing `id`s have their fields updated (edit here, restart to apply)
#   - entries NOT listed here are left untouched (admin/org-private stay)
#
# `digest` is the reproducibility pin — leave null and the scheduler
# name-matches; fill it (via `python -m scripts.capture_catalog`, which
# reads a live Ollama) to enable the strict same-tag/different-digest guard.
#
# `id` is a stable platform slug — what the user puts in body.model. Never
# reuse an id for a different artifact; deprecate instead.

