<svg width="680" viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sheshnag supply and demand sides</title>
<desc>Users on the demand side submit batch jobs to the Sheshnag control plane and get results back. On the supply side, providers are members of organizations, organizations own GPU workers registered via org API keys, and workers poll the control plane for jobs.</desc>
<rect x="0" y="0" width="680" height="352" fill="#FDFCF9"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
</style></defs>

<rect x="40" y="48" width="190" height="122" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" rx="4"/>
<text x="50" y="66" class="ts" fill="#888780">Demand side</text>

<rect x="496" y="48" width="144" height="278" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" rx="4"/>
<text x="506" y="66" class="ts" fill="#888780">Supply side</text>

<g>
<rect x="55" y="82" width="160" height="68" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="106" class="th" text-anchor="middle" fill="#3C3489">Users</text>
<text x="135" y="124" class="ts" text-anchor="middle" fill="#534AB7">faculty &amp; students</text>
<text x="135" y="140" class="ts" text-anchor="middle" fill="#534AB7">submit batch jobs</text>
</g>

<g>
<rect x="278" y="82" width="170" height="190" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="363" y="106" class="th" text-anchor="middle" fill="#444441">Sheshnag</text>
<text x="363" y="122" class="ts" text-anchor="middle" fill="#5F5E5A">control plane</text>
<text x="363" y="156" class="ts" text-anchor="middle" fill="#5F5E5A">job queue &amp; scheduler</text>
<text x="363" y="178" class="ts" text-anchor="middle" fill="#5F5E5A">model catalogue</text>
<text x="363" y="200" class="ts" text-anchor="middle" fill="#5F5E5A">usage accounting</text>
<text x="363" y="222" class="ts" text-anchor="middle" fill="#5F5E5A">requeue on failure</text>
<text x="363" y="244" class="ts" text-anchor="middle" fill="#5F5E5A">files &amp; results store</text>
</g>

<g>
<rect x="506" y="82" width="128" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="103" class="th" text-anchor="middle" fill="#085041">Providers</text>
<text x="570" y="121" class="ts" text-anchor="middle" fill="#0F6E56">lab GPU owners</text>
</g>

<g>
<rect x="506" y="158" width="128" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="570" y="179" class="th" text-anchor="middle" fill="#712B13">Organizations</text>
<text x="570" y="197" class="ts" text-anchor="middle" fill="#993C1D">labs, courses, clubs</text>
</g>

<g>
<rect x="506" y="234" width="128" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="257" class="th" text-anchor="middle" fill="#085041">Workers</text>
<text x="570" y="275" class="ts" text-anchor="middle" fill="#0F6E56">daemon + GPUs</text>
<text x="570" y="291" class="ts" text-anchor="middle" fill="#0F6E56">Ollama / vLLM</text>
</g>

<line x1="219" y1="100" x2="272" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246" y="93" class="lbl" text-anchor="middle">batches</text>
<line x1="274" y1="130" x2="221" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246" y="123" class="lbl" text-anchor="middle">results</text>

<line x1="545" y1="138" x2="545" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="553" y="150" class="lbl">members</text>

<line x1="545" y1="214" x2="545" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="553" y="226" class="lbl">org API key</text>

<line x1="502" y1="244" x2="452" y2="244" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="477" y="237" class="lbl" text-anchor="middle">poll</text>
<line x1="452" y1="264" x2="502" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="477" y="277" class="lbl" text-anchor="middle">jobs</text>
</svg>
